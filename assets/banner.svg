<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rick Das - AI and Tech Enthusiast, App and Web Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a0b2e;#0f0c29" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#5b1a4a;#302b63" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#7a1f3d;#24243e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="50%" stop-color="#ff9e7a"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <g filter="url(#blur)" opacity="0.55">
    <circle cx="180" cy="60" r="70" fill="#ff4d6d">
      <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;120;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="220" r="80" fill="#c77dff">
      <animate attributeName="cx" values="620;540;620" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="80" r="75" fill="#ff9e7a">
      <animate attributeName="cy" values="80;160;80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1020;940;1020" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="128" font-size="72" font-weight="800" fill="url(#txt)" letter-spacing="2">
      Rick Das
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="600" y="178" font-size="24" fill="#ffffff" opacity="0.9" letter-spacing="3">
      AI &amp; TECH ENTHUSIAST  •  APP &amp; WEB DEVELOPER
      <animate attributeName="opacity" values="0;0.9" dur="1.8s" fill="freeze"/>
    </text>
  </g>

  <rect x="480" y="198" width="240" height="4" rx="2" fill="url(#txt)">
    <animate attributeName="width" values="0;240" dur="1.5s" fill="freeze"/>
    <animate attributeName="x" values="600;480" dur="1.5s" fill="freeze"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
